[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "fripuck2"
version = "0.0.1"
authors = [
  { name="Léoanard Clément", email="leonard.clement@unifr.ch" },
]
description = "Python library of use with the e-puck2 with fripuck2 firmware."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

