; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:black_f407vg]
platform = ststm32
board = black_f407vg
framework = stm32cube

; Dependencies
lib_deps = 
  FreeRTOS

; Building
board_build.stm32cube.custom_config_header = yes
build_flags =
  -mfpu=fpv4-sp-d16
  -mfloat-abi=softfp
  -Ilib/FreeRTOS/include
  -Ilib/FreeRTOS/CMSIS_RTOS_V2
  -Ilib/FreeRTOS/portable/GCC/ARM_CM4F

; Uploading 
upload_protocol = blackmagic
upload_port = /dev/serial/by-id/usb-Black_Sphere_Technologies_Black_Magic_Probe__e-puck2_-_Options_CS_-_Firmware_v1.6.1-339-g_EPUCK-if00

; Debugging 
debug_tool = blackmagic
debug_port = /dev/serial/by-id/usb-Black_Sphere_Technologies_Black_Magic_Probe__e-puck2_-_Options_CS_-_Firmware_v1.6.1-339-g_EPUCK-if00