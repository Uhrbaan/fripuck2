; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
board_build.filesystem = littlefs
framework = espidf

board_upload.flash_size = 4MB
board_build.f_flash = 80000000L

; Custom partitions, give ~ 2Mb flash size, 1.9Mb FS
board_build.partitions = partitions.csv

; Dependencies 
lib_deps = 
  flatcc=symlink://../shared/flatcc
  flatcc-generated=symlink://../shared/flatcc-generated
  communication-config=symlink://../shared/communication

; Build settings
build_type = debug
build_flags = 
	-DCORE_DEBUG_LEVEL=5
	-DESP_WIFI_DEBUG
  -DTCPIP_ADAPTER_DEBUG
  -DMBEDTLS_DEBUG
  -DDEBUG
  -DLUA_32BITS
  -DLUA_USE_POSIX
  -DLUA_DL_NONE
  ; Lua specific errors since it uses old C
  -Wno-error=misleading-indentation
  -Wno-error=implicit-fallthrough
  -Wno-error=address
  -Wno-misleading-indentation
  -Wno-implicit-fallthrough
  -Wno-address

board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS="sdkconfig.board"

; Uploading
; This is usually /dev/ttyACM1, but it can change.
; If you run ls -l /dev/serial/by-id/, you symlinks to the correct port with serial names.
upload_port = /dev/serial/by-id/usb-Black_Sphere_Technologies_Black_Magic_Probe__e-puck2_-_Options_CS_-_Firmware_v1.6.1-339-g_EPUCK-if02
upload_flags = 
  --before
  default_reset
  --after
  hard_reset
board_build.sdkconfig_path = sdkconfig.defaults
upload_speed = 115200
board_build.flash_mode = dio

; Monitoring
monitor_speed = 230400
monitor_port = /dev/serial/by-id/usb-Black_Sphere_Technologies_Black_Magic_Probe__e-puck2_-_Options_CS_-_Firmware_v1.6.1-339-g_EPUCK-if02
monitor_filters = esp32_exception_decoder

; Debug
debug_tool = esp-prog